<div class="parking-grid" [style.--spots-per-row]="spotsPerRow()">
  @for (item of layoutItems(); track $index) {
    @if (item.type === 'corridor') {
      <div class="parking-corridor" [style.grid-column]="'span ' + spotsPerRow()">
        <div class="corridor-road">
          <div class="road-dashed-line"></div>
          <div class="corridor-direction" [class.left]="item.direction === 'left'">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" class="direction-arrow">
              <path stroke-linecap="round" stroke-linejoin="round" d="M13.5 4.5 21 12m0 0-7.5 7.5M21 12H3" />
            </svg>
            <span>SETOR {{ item.direction === 'left' ? 'OESTE' : 'LESTE' }}</span>
          </div>
        </div>
      </div>
    } @else if (item.type === 'spot' && item.spot) {
      <div
        class="parking-space"
        [class.occupied]="item.spot.status === 'Ocupada'"
        [class.top-open]="item.orientation === 'top-open'"
        [class.bottom-open]="item.orientation === 'bottom-open'"
        (click)="onSpotClick(item.spot)"
      >
        <span class="space-number">{{ item.spot.number }}</span>
        @if (item.spot.status === 'Ocupada' && item.spot.ticket) {
          <svg class="space-car-icon" viewBox="0 0 90 42" xmlns="http://www.w3.org/2000/svg"
               [style.transform]="item.spot.number % 3 === 0 ? 'rotate(180deg)' : 'rotate(0deg)'">
            <rect x="15" y="0" width="12" height="5" rx="1.5" fill="#18181b" />
            <rect x="15" y="37" width="12" height="5" rx="1.5" fill="#18181b" />
            <rect x="63" y="0" width="12" height="5" rx="1.5" fill="#18181b" />
            <rect x="63" y="37" width="12" height="5" rx="1.5" fill="#18181b" />

            <path d="M 52,4 C 52,0 55,0 55,4 Z" fill="#27272a" />
            <path d="M 52,38 C 52,42 55,42 55,38 Z" fill="#27272a" />

            <path d="M 10,8 C 10,5 15,4 30,4 L 68,4 C 78,4 82,7 82,12 L 84,16 C 85,18 85,24 84,26 L 82,30 C 82,35 78,38 68,38 L 30,38 C 15,38 10,37 10,34 C 8,30 8,12 10,8 Z" 
                  [style.fill]="getCarColorHex(item.spot.ticket)" 
                  stroke="#18181b" 
                  stroke-width="1.5" />

            <path d="M 68,9 C 74,10 78,14 80,21 C 78,28 74,32 68,33" fill="none" stroke="#18181b" stroke-width="1" opacity="0.25" />
            <path d="M 72,12 L 78,16" fill="none" stroke="#18181b" stroke-width="0.8" opacity="0.2" />
            <path d="M 72,30 L 78,26" fill="none" stroke="#18181b" stroke-width="0.8" opacity="0.2" />

            <path d="M 54,8 L 62,10 C 64,11 64,31 62,32 L 54,34 C 52,34 50,30 50,21 C 50,12 52,8 54,8 Z" fill="#18181b" opacity="0.85" />
            <path d="M 52,14 L 57,10 Q 59,10 59,12 L 54,16 Z" fill="#ffffff" opacity="0.25" />

            <path d="M 20,9 L 26,9 C 27,9 28,12 28,21 C 28,30 27,33 26,33 L 20,33 C 19,33 18,30 18,21 C 18,12 19,9 20,9 Z" fill="#18181b" opacity="0.85" />
            <path d="M 19,13 L 23,10 Q 24,10 24,11 L 20,14 Z" fill="#ffffff" opacity="0.2" />

            <path d="M 29,7 L 48,7 C 49,7 49,8 48,10 L 30,10 C 29,10 28,8 29,7 Z" fill="#18181b" opacity="0.85" />
            <path d="M 29,35 L 48,35 C 49,35 49,34 48,32 L 30,32 C 29,32 28,34 29,35 Z" fill="#18181b" opacity="0.85" />
            
            <path d="M 28,10 C 28,10 32,8 40,8 L 48,10 C 50,11 50,31 48,32 L 40,34 C 32,34 28,32 28,32 Z" fill="none" stroke="#18181b" stroke-width="1.2" opacity="0.3" />

            <path d="M 81,6 C 82,7 82,9 81,10" stroke="#fef08a" stroke-width="1.5" stroke-linecap="round" fill="none" />
            <path d="M 81,36 C 82,35 82,33 81,32" stroke="#fef08a" stroke-width="1.5" stroke-linecap="round" fill="none" />

            <path d="M 9,6 C 8,7 8,9 9,10" stroke="#ef4444" stroke-width="2" stroke-linecap="round" fill="none" />
            <path d="M 9,36 C 8,35 8,33 9,32" stroke="#ef4444" stroke-width="2" stroke-linecap="round" fill="none" />
          </svg>
        }
      </div>
    } @else {
      <div class="parking-space-empty"></div>
    }
  }
</div>
