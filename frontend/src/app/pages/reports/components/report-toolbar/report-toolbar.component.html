<div class="report-toolbar">
  <app-date-range-picker (rangeChange)="onRangeChange($event)" />

  <div class="export-menu">
    <button type="button" class="export-btn" [disabled]="isDisabled()" (click)="toggleMenu()">
      @if (exportingFormat()) {
        <span class="spinner"></span>
      }
      Exportar
      <span class="chevron" [class.open]="isMenuOpen()">▾</span>
    </button>

    @if (isMenuOpen()) {
      <div class="export-dropdown">
        @for (option of formatOptions; track option.format) {
          <button type="button" class="export-option" (click)="requestExport(option.format)">
            {{ option.label }}
          </button>
        }
      </div>
    }
  </div>
</div>
