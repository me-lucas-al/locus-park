<div class="vehicle-select-container">

  <div class="vehicle-select-field-group">
    <label class="vehicle-select-label" for="brand-select-input">Marca</label>
    <app-searchable-select
      placeholder="Digite para filtrar as marcas..."
      [options]="brandsQuery.data() ?? []"
      [isLoading]="brandsQuery.isPending()"
      [errorMessage]="brandsError()"
      (optionSelected)="onBrandSelected($event)"
    />
  </div>

  <div class="vehicle-select-field-group">
    <label class="vehicle-select-label" for="model-select-input">Modelo</label>
    <app-searchable-select
      #modelSelect
      placeholder="Selecione uma marca primeiro..."
      [options]="modelsQuery.data() ?? []"
      [isLoading]="modelsQuery.isFetching()"
      [disabled]="isModelSelectDisabled()"
      [errorMessage]="modelsError()"
      (optionSelected)="onModelSelected($event)"
    />
  </div>

</div>
